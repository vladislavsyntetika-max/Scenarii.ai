openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scripts
    description: Script generation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateScript
      tags: [scripts]
      summary: Generate a video script
      description: Uses AI to generate a Hook/Body/CTA script from a niche and video idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptInput"
      responses:
        "200":
          description: Generated script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptOutput"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScriptInput:
      type: object
      properties:
        niche:
          type: string
          minLength: 1
        idea:
          type: string
          minLength: 1
      required:
        - niche
        - idea
    ScriptOutput:
      type: object
      properties:
        hook:
          type: string
        body:
          type: string
        cta:
          type: string
      required:
        - hook
        - body
        - cta
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
