openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scripts
    description: Script generation and management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateScript
      tags: [scripts]
      summary: Generate a video script
      description: Uses AI to generate a detailed shot-by-shot script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptInput"
      responses:
        "200":
          description: Generated script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RichScriptOutput"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trending:
    post:
      operationId: getTrendingIdeas
      tags: [scripts]
      summary: Get trending video ideas with a ready script for the best one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrendingInput"
      responses:
        "200":
          description: Trending ideas and best script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingOutput"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /scripts:
    get:
      operationId: listScripts
      tags: [scripts]
      summary: List all saved scripts
      description: Returns all saved scripts ordered by newest first
      responses:
        "200":
          description: List of saved scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedScript"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: saveScript
      tags: [scripts]
      summary: Save a generated script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveScriptInput"
      responses:
        "201":
          description: Script saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedScript"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /scripts/{id}:
    delete:
      operationId: deleteScript
      tags: [scripts]
      summary: Delete a saved script
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Script deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Script not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScriptInput:
      type: object
      properties:
        niche:
          type: string
          minLength: 1
        idea:
          type: string
          minLength: 1
      required:
        - niche
        - idea
    HookVariant:
      type: object
      properties:
        text:
          type: string
        style:
          type: string
      required:
        - text
        - style
    Shot:
      type: object
      properties:
        id:
          type: integer
        section:
          type: string
        timing:
          type: string
        visual:
          type: string
        voiceover:
          type: string
        overlay:
          type: string
        sfx:
          type: string
      required:
        - id
        - section
        - timing
        - visual
        - voiceover
        - overlay
        - sfx
    RichScriptOutput:
      type: object
      properties:
        hooks:
          type: array
          items:
            $ref: "#/components/schemas/HookVariant"
        shots:
          type: array
          items:
            $ref: "#/components/schemas/Shot"
        music:
          type: string
        totalDuration:
          type: string
      required:
        - hooks
        - shots
        - music
        - totalDuration
    SaveScriptInput:
      type: object
      properties:
        niche:
          type: string
          minLength: 1
        idea:
          type: string
          minLength: 1
        hook:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        cta:
          type: string
          minLength: 1
        rawData:
          type: object
          additionalProperties: true
      required:
        - niche
        - idea
        - hook
        - body
        - cta
    SavedScript:
      type: object
      properties:
        id:
          type: integer
        niche:
          type: string
        idea:
          type: string
        hook:
          type: string
        body:
          type: string
        cta:
          type: string
        rawData:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - niche
        - idea
        - hook
        - body
        - cta
        - createdAt
    DeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    TrendingInput:
      type: object
      properties:
        niche:
          type: string
          minLength: 1
      required:
        - niche
    TrendingOutput:
      type: object
      properties:
        trending_ideas:
          type: array
          items:
            type: string
        best_idea_index:
          type: integer
        best_script:
          $ref: "#/components/schemas/RichScriptOutput"
      required:
        - trending_ideas
        - best_idea_index
        - best_script
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
